# API users, one per role (see SecurityConfig)
app.security.reader.username=reader
app.security.reader.password=reader-password
app.security.writer.username=writer
app.security.writer.password=writer-password
app.security.admin.username=admin
app.security.admin.password=admin-password

# Datasource's configuration for H2
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 console configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Paging: cap the page size clients can request
spring.data.web.pageable.max-page-size=100
