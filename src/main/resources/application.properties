# API users (see SecurityUsersProperties). The key after "users." is the username.
# To add a user, add a password and one or more comma-separated roles: READER, WRITER, ADMIN.
app.security.users.reader.password=reader-password
app.security.users.reader.roles=READER
app.security.users.writer.password=writer-password
app.security.users.writer.roles=WRITER
app.security.users.admin.password=admin-password
app.security.users.admin.roles=ADMIN
app.security.users.dima.password=dima
app.security.users.dima.roles=ADMIN

# Datasource's configuration for H2
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 console configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Paging: cap the page size clients can request
spring.data.web.pageable.max-page-size=100

# Close the persistence context when the service transaction ends, not at the end of the HTTP request
spring.jpa.open-in-view=false
